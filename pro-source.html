<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Latino Built Pro Source — Field Estimator</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--brand:#6B2D0F;--brand-mid:#8B3A12;--brand-light:#A0522D;--accent:#E87A2A;--bg:#F7F3EF;--surface:#fff;--border:#E8DDD4;--text:#1C1209;--muted:#9C7B6B}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text)}body{display:flex;flex-direction:column;overflow:hidden}
.probar{height:64px;flex:0 0 64px;background:linear-gradient(135deg,var(--brand),var(--brand-mid) 60%,var(--brand-light));color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px;box-shadow:0 2px 12px rgba(0,0,0,.18);z-index:10}
.mark{width:40px;height:40px;border-radius:11px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.14);display:grid;place-items:center;font-weight:800;font-family:'DM Mono',monospace;letter-spacing:-.06em}.brand{min-width:0}.eyebrow{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;opacity:.72}.title{font-size:.95rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{margin-left:auto;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12);border-radius:999px;padding:6px 10px;font-size:.68rem;font-weight:700;white-space:nowrap}
.frame{position:relative;flex:1;min-height:0;background:#fff}.frame iframe{width:100%;height:100%;border:0;display:block;background:#fff}.watermark{position:absolute;right:14px;bottom:12px;z-index:5;pointer-events:none;background:rgba(255,255,255,.88);border:1px solid var(--border);border-radius:999px;padding:6px 10px;font-family:'DM Mono',monospace;font-size:.62rem;font-weight:500;color:var(--brand);box-shadow:0 2px 8px rgba(107,45,15,.08)}
@media(max-width:560px){.probar{height:58px;flex-basis:58px;padding:0 10px;gap:9px}.mark{width:34px;height:34px;border-radius:9px}.title{font-size:.82rem}.eyebrow{font-size:.55rem}.badge{display:none}.watermark{right:8px;bottom:8px;font-size:.56rem;padding:5px 8px}}
</style>
</head>
<body>
<header class="probar">
  <div class="mark">LB</div>
  <div class="brand">
    <div class="eyebrow">Latino Built · Pro Source</div>
    <div class="title">Field Estimator / Estimador de Trabajo</div>
  </div>
  <div class="badge">Free contractor tool</div>
</header>
<main class="frame">
  <iframe src="index.html" title="Field Estimator"></iframe>
  <div class="watermark">A contractor resource from Latino Built</div>
</main>
</body>
</html>
