<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Latino Built Pro Source — Field Estimator</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--brand:#6B2D0F;--brand-mid:#8B3A12;--brand-light:#A0522D;--accent:#E87A2A;--bg:#F7F3EF;--surface:#fff;--border:#E8DDD4;--text:#1C1209;--muted:#9C7B6B;--green:#166534}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text)}body{display:flex;flex-direction:column;overflow:hidden}
.probar{height:68px;flex:0 0 68px;background:linear-gradient(135deg,var(--brand),var(--brand-mid) 60%,var(--brand-light));color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px;box-shadow:0 2px 12px rgba(0,0,0,.18);z-index:10}.mark{width:40px;height:40px;border-radius:11px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.14);display:grid;place-items:center;font-weight:800;font-family:'DM Mono',monospace;letter-spacing:-.06em}.brand{min-width:0}.eyebrow{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;opacity:.72}.title{font-size:.95rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.right{margin-left:auto;display:flex;align-items:center;gap:8px}.badge,.save{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12);border-radius:999px;padding:6px 10px;font-size:.68rem;font-weight:700;white-space:nowrap}.save{font-family:'DM Mono',monospace;font-weight:500}.save.ok{background:rgba(255,255,255,.2)}
.frame{position:relative;flex:1;min-height:0;background:#fff}.frame iframe{width:100%;height:100%;border:0;display:block;background:#fff}.watermark{position:absolute;right:14px;bottom:12px;z-index:5;pointer-events:none;background:rgba(255,255,255,.92);border:1px solid var(--border);border-radius:999px;padding:6px 10px;font-family:'DM Mono',monospace;font-size:.62rem;font-weight:500;color:var(--brand);box-shadow:0 2px 8px rgba(107,45,15,.08)}
@media(max-width:700px){.probar{height:60px;flex-basis:60px;padding:0 10px;gap:9px}.mark{width:34px;height:34px;border-radius:9px}.title{font-size:.82rem}.eyebrow{font-size:.55rem}.badge{display:none}.save{font-size:.55rem;padding:5px 7px}.watermark{right:8px;bottom:8px;font-size:.54rem;padding:5px 8px}}
</style>
</head>
<body>
<header class="probar"><div class="mark">LB</div><div class="brand"><div class="eyebrow">Latino Built · Pro Source</div><div class="title">Field Estimator / Estimador de Trabajo</div></div><div class="right"><div class="save" id="saveState">Draft stays on this device</div><div class="badge">Free contractor tool</div></div></header>
<main class="frame"><iframe id="tool" src="tool.html" title="Field Estimator"></iframe><div class="watermark">A contractor resource from Latino Built</div></main>
<script>
const KEY='latino-built-field-estimator-draft-v1',frame=document.getElementById('tool'),saveState=document.getElementById('saveState');
function flashSaved(){saveState.textContent='Saved on this device';saveState.classList.add('ok');clearTimeout(window.__saveTimer);window.__saveTimer=setTimeout(()=>{saveState.textContent='Draft stays on this device';saveState.classList.remove('ok')},1800)}
function collect(doc){const data={};doc.querySelectorAll('input[id],select[id],textarea[id]').forEach(el=>{if(el.type==='button'||el.type==='submit')return;data[el.id]={type:el.type||el.tagName.toLowerCase(),value:el.value,checked:!!el.checked};});return data}
function saveDraft(){try{localStorage.setItem(KEY,JSON.stringify(collect(frame.contentDocument)));flashSaved()}catch(e){}}
function restoreDraft(){try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(!saved)return;const doc=frame.contentDocument;Object.entries(saved).forEach(([id,v])=>{const el=doc.getElementById(id);if(!el)return;if(el.type==='checkbox'||el.type==='radio')el.checked=!!v.checked;else el.value=v.value??'';try{el.dispatchEvent(new Event(el.type==='checkbox'||el.tagName==='SELECT'?'change':'input',{bubbles:true}))}catch(e){}});saveState.textContent='Draft restored from this device';setTimeout(()=>{saveState.textContent='Draft stays on this device'},2200)}catch(e){}}
function addRateNote(doc){if(doc.getElementById('lb-rate-note'))return;const main=doc.querySelector('#screen-estimator .main');if(!main)return;const n=doc.createElement('div');n.id='lb-rate-note';n.innerHTML='<strong>Field estimate note:</strong> Use incentive amounts as a working reference. Program rates and eligibility can change, so confirm current requirements before promising a final incentive amount to a customer.';n.style.cssText='margin:0 0 14px;padding:11px 13px;border:1.5px solid #E8DDD4;border-left:4px solid #E87A2A;border-radius:10px;background:#FDF8F4;color:#5C4033;font:600 12px/1.5 DM Sans,sans-serif;';main.insertBefore(n,main.firstChild)}
frame.addEventListener('load',()=>{const doc=frame.contentDocument;restoreDraft();addRateNote(doc);let timer;const queue=()=>{clearTimeout(timer);timer=setTimeout(saveDraft,300)};doc.addEventListener('input',queue,true);doc.addEventListener('change',queue,true);});
</script></body></html>
